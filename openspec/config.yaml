schema: spec-driven

context: |
  Language: English
  All artifacts must be written in English.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.
  Project: Ariadna, an open, extensible ground-based space-navigation platform with an open specification, reference implementation, and interoperability tests; Moon-to-Mars is the first reference use case.
  Product direction is recorded in openspec/VISION.md. CCSDS interchange is planned, not implemented or certified; this direction does not expand the active milestone automatically.
  This is ground engineering software, not onboard flight software.
  Runtime: Python 3.12.14 in a reproducible Miniforge/Conda environment; Conda owns TudatPy and native/scientific dependencies, while uv 0.12.9 is used only inside that environment for local pure-Python installs.
  The application will use TudatPy and its SPICE interface; it must not develop a production astrodynamics engine from scratch.
  Canonical internal conventions are SSB origin, J2000 orientation, TDB seconds since J2000, and SI units.
  Search-window start and end dates are always required and never receive defaults.
  All spacecraft physical parameters are required; none receive hidden defaults.
  The current moon_to_mars.py file is an immutable legacy educational model and must remain untouched and unimported by the new package.
  Work follows the linear milestones documented in openspec/ROADMAP.md; M1 and M2 are archived, and M3 is active through refine-physical-trajectory.
  M3 refines one explicitly selected impulsive-transfer candidate with pinned high-fidelity force models, variable mass, finite burns, bounded correction, and honest physical status; M4-M6 remain deferred.

rules:
  proposal:
    - Keep proposals concise and include an explicit Non-goals section.
    - Identify the roadmap milestone implemented by the change.
  specs:
    - Give each requirement at least one concrete acceptance scenario.
    - Every acceptance scenario must use measurable WHEN and THEN conditions.
    - State units, time scale, frame origin, and frame orientation wherever state data crosses a public boundary.
  design:
    - Record public Python and CLI interfaces, error behavior, dependency boundaries, and rejected alternatives.
    - Keep later roadmap milestones outside the active implementation scope.
  tasks:
    - Keep every implementation checkbox initially unchecked.
    - Give every implementation task a corresponding verification in the same checkbox.
    - Include the complete test suite and strict validation as explicit tasks.

operations:
  apply:
    guidance:
      - Run openspec validate <change> --strict before implementation is marked complete.
      - Run focused checks and the complete pinned test suite before marking implementation complete.
      - Preserve moon_to_mars.py byte-for-byte and keep it unimported by space_nav.
      - Do not implement behavior assigned to a later roadmap milestone.
  archive:
    guidance:
      - Sync delta specs to main specs before archival.
      - Run openspec validate <change> --strict immediately before archival.
      - Do not create the next milestone change until archival succeeds.
      - Update openspec/ROADMAP.md after archival succeeds.
