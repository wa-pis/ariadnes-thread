[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "space-nav"
version = "0.2.0"
description = "Ground-based Moon-to-Mars navigation prototype"
requires-python = ">=3.11,<3.12"
# TudatPy is distributed through Conda rather than PyPI. Runtime versions are
# therefore resolved and pinned together in environment.yml.
dependencies = []

[project.scripts]
space-nav = "space_nav.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
